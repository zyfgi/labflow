# LabFlow production Nginx: TLS termination + static frontend + API proxy.
# PostgreSQL (5432) and uvicorn (8000) must NOT be exposed beyond localhost.

server {
    listen 80;
    server_name lab.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lab.example.edu;

    ssl_certificate     /etc/letsencrypt/live/lab.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 110m;  # keep above the runtime UPLOAD_MAX_MB

    # static SPA (vue build output)
    root /opt/labflow/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> local uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # QR tag landing (PUBLIC_BASE_URL/q/{token}) is handled by the SPA router
}
